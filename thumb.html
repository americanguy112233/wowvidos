<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Ника — что я ем на сушке, обложка</title>
<style>
@font-face { font-family: Unb; src: url(assets/fonts/Unbounded-VF.ttf); font-weight: 200 900; }
@font-face { font-family: Man; src: url(assets/fonts/Manrope-VF.ttf); font-weight: 200 800; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f4f1ec; font-family: Man; color: #121212; position: relative; overflow: hidden; }
body.v { width: 1080px; height: 1920px; } body.h { width: 1920px; height: 1080px; }
.abs { position: absolute; }
.bg { inset: 0; background: radial-gradient(60% 45% at 80% 20%, #fbe3e3 0, transparent 70%), #f4f1ec; }
.t { font: 900 150px/1 Unb; letter-spacing: -5px; } .t em { font-style: normal; color: #c8102e; }
.ph { border-radius: 60px; overflow: hidden; box-shadow: 0 30px 80px rgba(60,40,20,.2); } .ph img { width: 100%; height: 100%; object-fit: cover; }
.tag { font: 800 54px/1 Unb; padding: 26px 44px 30px; border-radius: 999px; background: #c8102e; color: #fff; white-space: nowrap; }
.prof { display: flex; align-items: center; gap: 22px; font: 800 44px/1 Man; } .prof img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; }
.prof span { display: block; font: 600 32px/1 Man; color: #8b857e; margin-top: 8px; }
.v .t { left: 0; right: 0; top: 230px; text-align: center; font-size: 104px; } .v .ph { left: 190px; top: 640px; width: 700px; height: 860px; }
.v .tag { left: 0; right: 0; margin: 0 auto; width: max-content; top: 1560px; } .v .prof { left: 70px; top: 80px; }
.h .t { left: 90px; top: 250px; font-size: 104px; } .h .ph { right: 110px; top: 90px; width: 700px; height: 900px; }
.h .tag { left: 90px; top: 760px; } .h .prof { left: 90px; top: 80px; }
</style></head>
<body>
<div class="abs bg"></div>
<div class="abs prof"><img src="assets/nika/face.jpg" alt=""><div>Я Ника<span>Фитнес | Питание</span></div></div>
<div class="abs t">ВЫКИНУЛА<br><em>«ПОЛЕЗНУЮ»</em><br>ЕДУ</div>
<div class="abs ph"><img src="assets/nika/face.jpg" alt=""></div>
<div class="abs tag">гранола · сок · орехи</div>
<script>
document.body.className = new URLSearchParams(location.search).get('v') === 'v' ? 'v' : 'h';
window.READY = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode())]);
</script>
</body></html>
