<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WoW Forever: голдфарм-точка (обложки)</title>
<!-- обложки: ролик №1 thumb-wow.html?v=a | b | c, ролик №2 v=d | e | f  (node thumb.mjs . "WoW голдфарм") -->
<style>
@font-face { font-family: Unb; src: url(assets/fonts/Unbounded-VF.ttf); font-weight: 200 900; }
@font-face { font-family: Aleg; src: url(assets/fonts/AlegreyaSC-Black.ttf); font-weight: 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #000; }
.abs { position: absolute; }
.bg { inset: 0; background-size: cover; background-position: center; }
.shade { inset: 0; }
.corner { left: -200px; top: -200px; width: 900px; height: 700px; background: radial-gradient(closest-side, rgba(0,0,0,.92), transparent); }   /* прячет вотермарк исходника */
/* Аня: крупно справа, золотой контур как на референсах */
.anna { right: -40px; bottom: -6px; height: 1000px;
  filter: drop-shadow(0 0 0 #fff) drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(0 0 30px rgba(255,200,60,.85)) drop-shadow(0 30px 40px rgba(0,0,0,.8)); }
.glow { border-radius: 50%; }
/* текст как на референсах: жирный, жёлтый и белый, чёрная обводка, лёгкий объём */
.t { font: 900 150px/.95 Unb; letter-spacing: -4px; text-transform: uppercase; -webkit-text-stroke: 14px #000; paint-order: stroke fill;
  text-shadow: 0 10px 0 #000, 0 22px 40px rgba(0,0,0,.6); white-space: nowrap; }
.y { color: #ffd51e; } .w { color: #fff; } .r { color: #ff3b30; }
.plate { padding: 14px 34px 22px; border-radius: 18px; background: #ffd51e; color: #111; font: 900 66px/1 Unb; letter-spacing: -2px; border: 6px solid #000; box-shadow: 0 12px 0 #000, 0 24px 40px rgba(0,0,0,.5); white-space: nowrap; }
.plate.dark { background: #111; color: #fff; border-color: #ffd51e; }
.logo { width: 280px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.9)); }
.coin { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c2, #ffcf3a 45%, #c47d00); border: 6px solid #e8a600; box-shadow: inset 0 -10px 0 rgba(120,60,0,.45), 0 14px 24px rgba(0,0,0,.6); }
.ico { width: 150px; height: 150px; border-radius: 18px; border: 6px solid #c9a14a; box-shadow: 0 0 0 4px #000, 0 16px 30px rgba(0,0,0,.6); background: radial-gradient(circle at 40% 35%, #4a3a26, #120c06); display: flex; align-items: center; justify-content: center; }
.ico svg { width: 82%; height: 82%; }
.mapcard { border-radius: 22px; overflow: hidden; border: 8px solid #fff; box-shadow: 0 0 0 5px #000, 0 30px 60px rgba(0,0,0,.7); background-size: cover; transform: rotate(-4deg); }
.ring { border-radius: 50%; border: 12px solid #ff3b30; box-shadow: 0 0 0 5px #fff, 0 0 40px rgba(255,59,48,.8); }
.arrow { font: 900 200px/1 Unb; color: #ff3b30; -webkit-text-stroke: 12px #fff; paint-order: stroke fill; filter: drop-shadow(0 10px 10px rgba(0,0,0,.6)); }
.v { display: none; } body.a .va, body.b .vb, body.c .vc, body.d .vd, body.e .ve, body.f .vf { display: block; }
</style>
</head>
<body>
<!-- A: «7 МОБОВ КАЖДЫЕ 10 СЕК» на фоне взрыва магии -->
<div class="v va">
  <div class="abs bg" style="background-image:url(assets/wow/thumb_bg.jpg)"></div>
  <div class="abs shade" style="background:linear-gradient(90deg, rgba(0,0,0,.75), rgba(0,0,0,.25) 50%, rgba(0,0,0,0) 70%), radial-gradient(50% 60% at 80% 50%, rgba(180,80,255,.45), transparent 70%)"></div>
  <div class="abs glow" style="right:60px;top:160px;width:820px;height:820px;background:radial-gradient(circle, rgba(255,209,0,.5), transparent 65%)"></div>
  <img class="abs anna" src="assets/wow/anna2_cut.png" alt="">
  <div class="abs corner"></div><img class="abs logo" src="assets/wow/logo.png" alt="" style="left:50px;top:40px">
  <div class="abs t y" style="left:60px;top:300px;font-size:190px">7 МОБОВ</div>
  <div class="abs t w" style="left:60px;top:500px;font-size:118px">КАЖДЫЕ 10 СЕК</div>
  <div class="abs plate" style="left:70px;top:700px;transform:rotate(-3deg)">ГОЛДФАРМ БЕЗ КОНКУРЕНТОВ</div>
  <div class="abs coin" style="left:1010px;top:110px;width:110px;height:110px;transform:rotate(-20deg)"></div>
  <div class="abs coin" style="left:1100px;top:260px;width:70px;height:70px"></div>
</div>

<!-- B: карта с красным кругом «НИКТО НЕ ФАРМИТ» -->
<div class="v vb">
  <div class="abs bg" style="background-image:url(assets/wow/thumb_bg_c.jpg);filter:blur(3px)"></div>
  <div class="abs shade" style="background:linear-gradient(90deg, rgba(0,0,0,.7), rgba(0,0,0,.2) 55%, rgba(0,0,0,0) 75%)"></div>
  <img class="abs anna" src="assets/wow/anna2_cut.png" alt="" style="height:960px;right:-80px">
  <div class="abs corner"></div><img class="abs logo" src="assets/wow/logo.png" alt="" style="right:40px;top:30px;width:240px">
  <div class="abs t y" style="left:60px;top:60px;font-size:132px">ЭТУ ТОЧКУ</div>
  <div class="abs t w" style="left:60px;top:205px;font-size:132px">НИКТО НЕ ФАРМИТ</div>
  <div class="abs mapcard" style="left:90px;top:420px;width:820px;height:461px;background-image:url(assets/wow/thumb_map.jpg)">
    <div class="abs ring" style="left:280px;top:290px;width:190px;height:190px"></div></div>
  <div class="abs arrow" style="left:600px;top:700px;transform:rotate(-12deg)">⬅</div>
</div>

<!-- C: сундук «ЗАПРЕТНЫЙ ФАРМ С 12 УРОВНЯ» -->
<div class="v vc">
  <div class="abs bg" style="background-image:url(assets/wow/thumb_bg_c.jpg)"></div>
  <div class="abs shade" style="background:linear-gradient(90deg, rgba(0,0,0,.8), rgba(0,0,0,.3) 50%, rgba(0,0,0,0) 72%), radial-gradient(40% 50% at 30% 75%, rgba(255,200,40,.4), transparent 70%)"></div>
  <div class="abs glow" style="right:80px;top:180px;width:800px;height:800px;background:radial-gradient(circle, rgba(255,209,0,.45), transparent 65%)"></div>
  <img class="abs anna" src="assets/wow/anna2_cut.png" alt="">
  <div class="abs corner"></div><img class="abs logo" src="assets/wow/logo.png" alt="" style="left:50px;top:40px">
  <div class="abs t r" style="left:60px;top:300px;font-size:150px">ЗАПРЕТНЫЙ</div>
  <div class="abs t y" style="left:60px;top:460px;font-size:150px">ГОЛДФАРМ</div>
  <div class="abs plate dark" style="left:70px;top:650px;transform:rotate(-3deg);font-size:72px">С 12 УРОВНЯ ✓</div>
  <div class="abs" style="left:640px;top:760px;display:flex;gap:26px">
    <div class="ico"><svg viewBox="0 0 100 100"><use href="#i-bag"/></svg></div>
    <div class="ico" style="border-color:#1eff00"><svg viewBox="0 0 100 100"><use href="#i-green"/></svg></div>
    <div class="ico"><svg viewBox="0 0 100 100"><use href="#i-linen"/></svg></div></div>
</div>

<!-- ═══ Ролик №2 (Болотина, 28→30): v=d | e | f ═══ -->
<!-- D: «ПОЛПОЛЯНЫ МОБОВ» на огромном пулле -->
<div class="v vd">
  <div class="abs bg" style="background-image:url(assets/wow/thumb2_bg.jpg)"></div>
  <div class="abs shade" style="background:linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,.25) 52%, rgba(0,0,0,0) 72%), radial-gradient(50% 60% at 80% 50%, rgba(180,80,255,.4), transparent 70%)"></div>
  <div class="abs glow" style="right:60px;top:160px;width:820px;height:820px;background:radial-gradient(circle, rgba(255,209,0,.45), transparent 65%)"></div>
  <img class="abs anna" src="assets/wow/anna2_cut.png" alt="">
  <img class="abs logo" src="assets/wow/logo.png" alt="" style="left:50px;top:40px">
  <div class="abs t y" style="left:60px;top:300px;font-size:128px">ПОЛПОЛЯНЫ</div>
  <div class="abs t w" style="left:60px;top:450px;font-size:150px">МОБОВ</div>
  <div class="abs plate" style="left:70px;top:680px;transform:rotate(-3deg)">И Я НЕ УМЕРЛА</div>
</div>

<!-- E: «30 УРОВЕНЬ» маг + шаман -->
<div class="v ve">
  <div class="abs bg" style="background-image:url(assets/wow/thumb2_bg_b.jpg)"></div>
  <div class="abs shade" style="background:linear-gradient(90deg, rgba(0,0,0,.8), rgba(0,0,0,.25) 52%, rgba(0,0,0,0) 72%)"></div>
  <div class="abs glow" style="right:60px;top:160px;width:820px;height:820px;background:radial-gradient(circle, rgba(60,220,140,.45), transparent 65%)"></div>
  <img class="abs anna" src="assets/wow/anna2_cut.png" alt="">
  <img class="abs logo" src="assets/wow/logo.png" alt="" style="left:50px;top:40px">
  <div class="abs t y" style="left:60px;top:300px;font-size:150px">30 УРОВЕНЬ</div>
  <div class="abs t w" style="left:60px;top:470px;font-size:74px">НА ОГРОМНЫХ ПУЛЛАХ</div>
  <div class="abs" style="left:70px;top:620px;display:flex;align-items:center;gap:22px">
    <div class="ico" style="background:radial-gradient(circle at 42% 38%,#fff 0,#ecc4ff 14%,#9b3cf0 52%,#2a0b4a 100%)"><svg viewBox="0 0 100 100"><use href="#i-arc"/></svg></div>
    <div class="t y" style="position:static;font-size:110px">+</div>
    <div class="ico" style="background:radial-gradient(circle at 40% 35%,#e8fff0,#3fd68a 45%,#0b4a2a)"><svg viewBox="0 0 100 100"><use href="#i-heal"/></svg></div>
    <div class="plate dark" style="font-size:60px;margin-left:12px">МАГ + ШАМАН</div></div>
</div>

<!-- F: «ЛУЧШАЯ ФЕРМА ДО 30» Орда -->
<div class="v vf">
  <div class="abs bg" style="background-image:url(assets/wow/thumb2_bg.jpg);filter:hue-rotate(-25deg) saturate(1.3)"></div>
  <div class="abs shade" style="background:linear-gradient(90deg, rgba(0,0,0,.82), rgba(0,0,0,.3) 52%, rgba(0,0,0,0) 72%), radial-gradient(40% 60% at 25% 60%, rgba(255,40,30,.35), transparent 70%)"></div>
  <div class="abs glow" style="right:60px;top:160px;width:820px;height:820px;background:radial-gradient(circle, rgba(255,60,40,.4), transparent 65%)"></div>
  <img class="abs anna" src="assets/wow/anna2_cut.png" alt="">
  <img class="abs logo" src="assets/wow/logo.png" alt="" style="left:50px;top:40px">
  <div class="abs t w" style="left:60px;top:300px;font-size:100px">ЛУЧШАЯ ФЕРМА</div>
  <div class="abs t y" style="left:60px;top:430px;font-size:118px">ДО 30 УРОВНЯ</div>
  <div class="abs plate" style="left:70px;top:620px;transform:rotate(-3deg);background:#ff3b30;color:#fff">ТОЛЬКО ДЛЯ ОРДЫ?!</div>
</div>
<div id="defs"></div>
<script>
document.body.className = new URLSearchParams(location.search).get('v') || 'a';
window.READY = fetch('tools/wow_defs.svg').then(r => r.text()).then(t => { document.getElementById('defs').innerHTML = t; });
</script>
</body>
</html>
